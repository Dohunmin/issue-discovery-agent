name: Daily Issue Discovery

on:
  schedule:
    - cron: '0 22 * * *'  # 22:00 UTC = 07:00 KST
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Write Instagram cookies
        env:
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
        if: env.INSTAGRAM_COOKIES != ''
        run: echo "$INSTAGRAM_COOKIES" > .instagram_cookies.json

      - name: Run agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          INSTAGRAM_SEED_ACCOUNTS: ${{ secrets.INSTAGRAM_SEED_ACCOUNTS }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_SEED_CHANNELS: ${{ secrets.YOUTUBE_SEED_CHANNELS }}
        run: python -m src.main
